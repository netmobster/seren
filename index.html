document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

; letter-spacing:.24em; text-transform:uppercase;\">Seren&nbsp;AI<\u002Fspan>\n    <\u002Fdiv>\n    <nav style=\"display:flex; align-items:center; gap:30px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#a39a8f;\">\n      <a href=\"#what\" style=\"color:#a39a8f;\" style-hover=\"color:#e8e1d6\">What it is<\u002Fa>\n      <a href=\"#how\" style=\"color:#a39a8f;\" style-hover=\"color:#e8e1d6\">How it works<\u002Fa>\n      <a href=\"#allows\" style=\"color:#a39a8f;\" style-hover=\"color:#e8e1d6\">What it allows<\u002Fa>\n      <a href=\"#fit\" style=\"color:#a39a8f;\" style-hover=\"color:#e8e1d6\">Fit<\u002Fa>\n      <a href=\"#waitlist\" style=\"display:inline-block; padding:9px 18px; border:1px solid #b07a4e; border-radius:2px; color:#e8e1d6; letter-spacing:.16em;\" style-hover=\"background:#b07a4e; color:#100d0b\">Join the waitlist<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"position:relative; padding:132px 44px 104px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(232,225,214,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(232,225,214,.028) 1px, transparent 1px); background-size:112px 112px; mask-image:radial-gradient(120% 90% at 70% 10%, #000 10%, transparent 78%);\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1240px; margin:0 auto; text-align:center;\">\n      <div style=\"display:flex; flex-direction:column; align-items:center; gap:30px; margin-bottom:52px;\">\n        <svg width=\"188\" height=\"188\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"display:block;\">\n          <circle cx=\"12\" cy=\"12\" r=\"10.5\" stroke=\"rgba(232,225,214,.16)\" stroke-width=\".4\"><\u002Fcircle>\n          <g style=\"transform-origin:12px 12px; animation:srSpin 72s linear infinite;\">\n            <circle cx=\"12\" cy=\"12\" r=\"6.6\" stroke=\"#b07a4e\" stroke-width=\".5\" stroke-dasharray=\"2.4 3.4\"><\u002Fcircle>\n            <circle cx=\"18.6\" cy=\"12\" r=\".9\" fill=\"#7f9b8c\"><\u002Fcircle>\n          <\u002Fg>\n          <circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"#b07a4e\"><\u002Fcircle>\n        <\u002Fsvg>\n        <div style=\"font-family:'Space Mono',monospace; font-size:clamp(22px,2.6vw,34px); letter-spacing:.42em; text-transform:uppercase; text-indent:.42em; color:#e8e1d6;\">Seren AI<\u002Fdiv>\n        <div style=\"display:flex; align-items:center; gap:13px; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:#b07a4e;\">\n          <span style=\"width:6px; height:6px; border-radius:50%; background:#7f9b8c; animation:srPulse 3.4s ease-in-out infinite;\"><\u002Fspan>\n          <span>Persistent world intelligence<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ showUncanny }}\" hint-placeholder-val=\"{{ true }}\">\n        <h1 style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(48px,7.4vw,116px); line-height:.94; letter-spacing:-.032em; text-wrap:balance;\">The world knows<br><span style=\"font-style:italic; color:#c89060;\">what happened.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showRemembers }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(48px,7.4vw,116px); line-height:.94; letter-spacing:-.032em; text-wrap:balance;\">Run a world<br><span style=\"font-style:italic; color:#c89060;\">that remembers.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ showAlive }}\" hint-placeholder-val=\"{{ false }}\">\n        <h1 style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(48px,7.4vw,116px); line-height:.94; letter-spacing:-.032em; text-wrap:balance;\">Your world.<br><span style=\"font-style:italic; color:#c89060;\">Alive.<\u002Fspan><\u002Fh1>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex; flex-direction:column; align-items:center; gap:40px; margin-top:52px;\">\n        <p style=\"margin:0; max-width:60ch; font-size:20px; line-height:1.62; color:#c4bcb1;\">SEREN AI is the Dungeon Master. You give it the bones of your world — structure, characters, factions, your own items and rules — and it invents everything else at the table, inside a canon it never loses. Improvisation, on top of memory.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; justify-content:center; gap:14px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.14em; text-transform:uppercase;\">\n          <a href=\"#waitlist\" style=\"display:inline-block; padding:15px 30px; background:#b07a4e; color:#100d0b; border-radius:2px; font-weight:700;\" style-hover=\"background:#c89060\">Build your campaign<\u002Fa>\n          <a href=\"#how\" style=\"display:inline-block; padding:15px 30px; border:1px solid rgba(232,225,214,.24); border-radius:2px; color:#e8e1d6;\" style-hover=\"border-color:#b07a4e\">See how it works<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:52px; padding-top:44px; border-top:1px solid rgba(232,225,214,.1); width:100%; display:flex; flex-direction:column; align-items:center; gap:22px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#93897f;\">Canon held · <span style=\"color:#e8e1d6;\">412 facts across 9 sessions<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:15px; text-align:left; font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.5; color:#c4bcb1; padding-left:24px; border-left:1px solid rgba(176,122,78,.42);\">\n            <div>Ser'en knows Noke is dead. Kestrel does not.<\u002Fdiv>\n            <div>The tower at Shinebright is unclaimed. Thirty-one days.<\u002Fdiv>\n            <div>The Ashgate compact holds, for now.<\u002Fdiv>\n            <div style=\"color:#7f9b8c;\">Three threads unresolved. One is moving.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#8a8077;\">World state · read continuously<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:104px 44px; border-bottom:1px solid rgba(232,225,214,.09); background:#0c0a09;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">The difference<\u002Fdiv>\n      <h2 style=\"margin:0 0 20px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(32px,4.2vw,60px); line-height:1.06; letter-spacing:-.026em; max-width:26ch;\">SEREN doesn't execute your campaign. It runs it.<\u002Fh2>\n      <p style=\"margin:0 0 64px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:60ch;\">You give it the bones — structure, beats, characters, factions, your own items and spells and rules. What happens between those bones is improvised at the table, by a DM that knows your world. Which means the same material never plays out the same way twice.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:1px; background:rgba(232,225,214,.1); border:1px solid rgba(232,225,214,.1);\">\n        <div style=\"background:#100d0b; padding:38px 34px 42px; display:flex; flex-direction:column; gap:24px;\">\n          <div style=\"display:flex; flex-direction:column; gap:7px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#8a8077;\">Conventional AI campaign tools<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Serif',serif; font-size:27px; line-height:1.24; color:#8d857c;\">A script with a narrator<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 280 120\" width=\"100%\" height=\"128\" fill=\"none\" style=\"display:block;\">\n            <path d=\"M24 34H256\" stroke=\"#332e2a\" stroke-width=\"1\"><\u002Fpath>\n            <path d=\"M24 60H256\" stroke=\"#332e2a\" stroke-width=\"1\"><\u002Fpath>\n            <path d=\"M24 86H256\" stroke=\"#332e2a\" stroke-width=\"1\"><\u002Fpath>\n            <circle cx=\"24\" cy=\"34\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"82\" cy=\"34\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"140\" cy=\"34\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"198\" cy=\"34\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"256\" cy=\"34\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle>\n            <circle cx=\"24\" cy=\"60\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"82\" cy=\"60\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"140\" cy=\"60\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"198\" cy=\"60\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"256\" cy=\"60\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle>\n            <circle cx=\"24\" cy=\"86\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"82\" cy=\"86\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"140\" cy=\"86\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"198\" cy=\"86\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle><circle cx=\"256\" cy=\"86\" r=\"3.4\" fill=\"#8a8077\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"display:flex; flex-direction:column; gap:11px; font-size:15px; line-height:1.62; color:#8d857c;\">\n            <div>Three tables. Three identical runs.<\u002Fdiv>\n            <div>Every beat is pre-written, then performed. Improvise off-script and it loses the thread — or quietly forgets the script entirely.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#141110; padding:38px 34px 42px; display:flex; flex-direction:column; gap:24px;\">\n          <div style=\"display:flex; flex-direction:column; gap:7px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#c89060;\">SEREN AI<\u002Fspan>\n            <span style=\"font-family:'IBM Plex Serif',serif; font-size:27px; line-height:1.24; color:#e8e1d6;\">A DM who knows the world<\u002Fspan>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 280 120\" width=\"100%\" height=\"128\" fill=\"none\" style=\"display:block;\">\n            <path d=\"M24 60C60 20 104 26 140 60C176 94 220 100 256 60\" stroke=\"#b07a4e\" stroke-width=\"1.1\" stroke-opacity=\".85\"><\u002Fpath>\n            <path d=\"M24 60C62 57 100 63 140 60C180 57 218 63 256 60\" stroke=\"#7f9b8c\" stroke-width=\"1.1\" stroke-opacity=\".7\"><\u002Fpath>\n            <path d=\"M24 60C58 96 106 104 140 60C174 16 222 24 256 60\" stroke=\"#e8e1d6\" stroke-width=\"1.1\" stroke-opacity=\".38\"><\u002Fpath>\n            <circle cx=\"24\" cy=\"60\" r=\"5\" fill=\"#b07a4e\"><\u002Fcircle>\n            <circle cx=\"140\" cy=\"60\" r=\"5\" fill=\"#b07a4e\"><\u002Fcircle>\n            <circle cx=\"256\" cy=\"60\" r=\"5\" fill=\"#b07a4e\"><\u002Fcircle>\n          <\u002Fsvg>\n          <div style=\"display:flex; flex-direction:column; gap:11px; font-size:15px; line-height:1.62; color:#c4bcb1;\">\n            <div>Three tables. Same bones. Three different campaigns.<\u002Fdiv>\n            <div>The anchors are yours and they hold. The route between them is played, not recited — and whatever the players do to it becomes permanent.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:38px 0 0; font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">The copper points are yours. Everything between them is the game.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">Player chaos<\u002Fdiv>\n      <h2 style=\"margin:0 0 20px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.4vw,62px); line-height:1.06; letter-spacing:-.026em; max-width:24ch;\">No plan survives contact with the players.<\u002Fh2>\n      <p style=\"margin:0 0 60px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:60ch;\">Going off script isn't a failure mode of tabletop. It is the whole appeal. Players will always do the thing nobody prepared for — and a system that only knows the plan treats that as an error. It refuses, it railroads you back, or it quietly drops the thread and pretends the detour never happened. SEREN takes the detour as canon and keeps building from there.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:56px; align-items:start;\">\n        <div style=\"display:flex; flex-direction:column; gap:26px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#8a8077; padding-bottom:16px; border-bottom:1px solid rgba(232,225,214,.12);\">The move nobody prepared for<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(21px,2.2vw,28px); line-height:1.34; color:#e8e1d6;\">The party ignores the tower entirely and befriends the rival's sister.<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#8d857c;\">Three prepared sessions, gone. Every scripted beat now points somewhere the players aren't.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:26px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#8a8077; padding-bottom:16px; border-bottom:1px solid rgba(232,225,214,.12);\">A scripted system<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px; font-size:16px; line-height:1.6; color:#8d857c;\">\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>Steers you back toward the tower.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>Invents a sister with no history and no stake.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>Forgets her by next session.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>Leaves the abandoned plot dangling forever.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:26px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#c89060; padding-bottom:16px; border-bottom:1px solid rgba(176,122,78,.4);\">SEREN<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:14px; font-size:16px; line-height:1.6; color:#c4bcb1;\">\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>The sister becomes a real person, consistent with the family you wrote.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>The friendship enters canon, and the rival hears about it.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>The tower stays unclaimed, and someone else moves on it.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>Your anchor still lands — by a route you would never have written.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <p style=\"margin:56px 0 0; font-family:'IBM Plex Serif',serif; font-style:italic; font-size:clamp(22px,2.4vw,32px); line-height:1.3; color:#c89060; max-width:34ch;\">The chaos is the story. SEREN builds it with you.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"what\" style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto; display:grid; grid-template-columns:minmax(0,200px) minmax(0,1fr); gap:64px;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; padding-top:12px;\">What it is<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:34px; max-width:74ch;\">\n        <p style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(24px,2.6vw,36px); line-height:1.38; letter-spacing:-.014em; color:#e8e1d6;\">A campaign in SEREN is not a transcript. It is a world — characters, factions, locations, objects, rules, secrets, consequences, unresolved threads, an evolving canon — and SEREN improvises freely inside it while keeping every part of it coherent, session after session.<\u002Fp>\n        <p style=\"margin:0; font-size:18px; line-height:1.68; color:#a39a8f; max-width:62ch;\">It works in chat. There is no application to learn and no dashboard to maintain. And it is a Dungeon Master, not a playback device: you give it the bones, and it makes the calls in the moment — never asking you to remind it what already happened.<\u002Fp>\n        <div style=\"display:flex; align-items:center; gap:13px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#93897f;\">\n          <span style=\"width:5px; height:5px; border-radius:50%; background:#7f9b8c;\"><\u002Fspan>\n          <span>Chat today · Table and VTT surfaces to follow<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <h2 style=\"margin:0 0 18px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.6vw,68px); line-height:1.04; letter-spacing:-.028em;\">AI can generate anything.<\u002Fh2>\n      <h2 style=\"margin:0 0 72px; font-family:'IBM Plex Serif',serif; font-weight:300; font-style:italic; font-size:clamp(34px,4.6vw,68px); line-height:1.04; letter-spacing:-.028em; color:#93897f;\">That's not the hard part.<\u002Fh2>\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">The hard part is remembering<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column;\">\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">01<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">what actually happened<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">02<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">who knows what<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">03<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">who hates whom<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">04<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">what the players changed<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">05<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">what remains unresolved<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:56px minmax(0,1fr); gap:20px; padding:22px 0; border-top:1px solid rgba(232,225,214,.1); border-bottom:1px solid rgba(232,225,214,.1); align-items:baseline;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#8a8077;\">06<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#e8e1d6;\">what the world should do next<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:40px 0 0; font-family:'IBM Plex Serif',serif; font-style:italic; font-size:clamp(22px,2.4vw,32px); color:#c89060;\">SEREN maintains those relationships.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"how\" style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">How it works<\u002Fdiv>\n      <h2 style=\"margin:0 0 20px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.4vw,62px); line-height:1.06; letter-spacing:-.026em; max-width:24ch;\">Three things, deliberately kept apart.<\u002Fh2>\n      <p style=\"margin:0 0 68px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:60ch;\">Most tools fuse the story, the rules and the current situation into one long conversation. SEREN separates them. That separation is the whole architecture — and the reason the system isn't bound to any single game.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:rgba(232,225,214,.1); border:1px solid rgba(232,225,214,.1);\">\n        <div style=\"background:#141110; padding:38px 32px 42px; display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#c89060;\">World<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8077;\">I<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:26px; line-height:1.24; color:#e8e1d6;\">Your universe.<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.66; color:#a39a8f;\">Canon, characters, places, factions, history, secrets, the things that are simply true. Yours — imported or grown at the table.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#141110; padding:38px 32px 42px; display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#c89060;\">Ruleset<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8077;\">II<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:26px; line-height:1.24; color:#e8e1d6;\">The mechanics.<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.66; color:#a39a8f;\">D&amp;D 5e, with your house rules treated as canon. A ruleset is a layer, not the foundation — which is why it can be swapped.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#141110; padding:38px 32px 42px; display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; align-items:center; justify-content:space-between;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#c89060;\">State<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8077;\">III<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:26px; line-height:1.24; color:#e8e1d6;\">What is true now.<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.66; color:#a39a8f;\">Every change your players caused, who witnessed it, what it cost, and what it set in motion. Live, and carried forward.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:56px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:64px; align-items:start;\">\n        <p style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(24px,2.5vw,34px); line-height:1.32; letter-spacing:-.016em;\">D&amp;D is where SEREN starts. <span style=\"color:#93897f; font-style:italic;\">It isn't where SEREN ends.<\u002Fspan><\u002Fp>\n        <p style=\"margin:0; font-size:16px; line-height:1.7; color:#a39a8f;\">Because the world, the rules and the live state are separate concerns, the architecture doesn't care which game you're playing. A science-fiction setting, an original universe, a system of your own — that is where this is going. Today it runs 5e, and it runs it properly.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09); background:#0c0a09;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">Consequence<\u002Fdiv>\n      <h2 style=\"margin:0 0 22px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(32px,4.2vw,60px); line-height:1.06; letter-spacing:-.026em; max-width:26ch;\">A death in session four is still a death in session forty.<\u002Fh2>\n      <p style=\"margin:0 0 76px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:58ch;\">One decision at the table doesn't resolve. It propagates — through people, places, factions and time — and the world goes on acting on it while nobody is looking.<\u002Fp>\n\n      <div style=\"display:flex; flex-direction:column;\">\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.12);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Session 4<\u002Fspan>\n          <span style=\"font-family:'IBM Plex Serif',serif; font-size:clamp(21px,2.3vw,31px); color:#e8e1d6;\">The party kills Noke.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.07);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Immediately<\u002Fspan>\n          <span style=\"padding-left:32px; font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#c4bcb1;\">Noke is dead. Permanently, and for everyone.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.07);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Same night<\u002Fspan>\n          <span style=\"padding-left:64px; font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#c4bcb1;\">Shinebright's future changes.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.07);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Day 3<\u002Fspan>\n          <span style=\"padding-left:96px; font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#c4bcb1;\">The tower stands unclaimed.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.07);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Day 31<\u002Fspan>\n          <span style=\"padding-left:128px; font-family:'IBM Plex Serif',serif; font-size:clamp(20px,2.1vw,28px); color:#c4bcb1;\">Local nobles begin to ask who owns it.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:120px minmax(0,1fr); gap:28px; align-items:baseline; padding:20px 0; border-top:1px solid rgba(232,225,214,.07); border-bottom:1px solid rgba(232,225,214,.12);\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#7f9b8c;\">Session 9<\u002Fspan>\n          <span style=\"padding-left:160px; font-family:'IBM Plex Serif',serif; font-style:italic; font-size:clamp(21px,2.3vw,31px); color:#c89060;\">A thread you never wrote is waiting for you.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:40px 0 0; font-size:17px; line-height:1.7; color:#a39a8f; max-width:56ch;\">SEREN doesn't forget the consequences just because the session ended. Nobody had to log any of this.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">What you bring<\u002Fdiv>\n      <h2 style=\"margin:0 0 20px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.4vw,62px); line-height:1.06; letter-spacing:-.026em; max-width:24ch;\">Give it the bones, not the script.<\u002Fh2>\n      <p style=\"margin:0 0 68px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:58ch;\">Structure, beat sheet, characters, factions, the shape of an ending — plus every custom item, spell, race and ruling you have invented. Not dialogue. Not scene text. You are handing over a skeleton and a rulebook, and SEREN puts the flesh on it live.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:minmax(0,1.3fr) 40px minmax(0,1fr); gap:32px; align-items:center;\">\n        <div style=\"display:flex; flex-wrap:wrap; gap:10px;\">\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Beat sheet<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Structure<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Characters<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Factions<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Locations<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Custom items<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">New spells<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">New races<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">House rules<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">Secrets<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px solid rgba(232,225,214,.16); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#c4bcb1;\">The shape of an ending<\u002Fspan>\n          <span style=\"padding:11px 18px; border:1px dashed rgba(127,155,140,.45); border-radius:2px; font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.08em; color:#8d857c; text-decoration:line-through;\">Scene-by-scene dialogue<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:center; justify-content:center; font-family:'Space Mono',monospace; font-size:18px; color:#b07a4e;\">→<\u002Fdiv>\n        <div style=\"padding:34px 30px; border:1px solid rgba(176,122,78,.34); background:#141110; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#c89060;\">A DM who runs it<\u002Fspan>\n          <p style=\"margin:0; font-size:15px; line-height:1.66; color:#a39a8f;\">SEREN holds your skeleton as canon and plays everything else live — dialogue, reactions, complications, the timing of a reveal. Your structure survives. The session is still a surprise.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:36px 0 0; font-family:'IBM Plex Serif',serif; font-style:italic; font-size:clamp(20px,2.2vw,28px); color:#c89060;\">Bring the bones. SEREN runs the game.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">Run it twice<\u002Fdiv>\n      <h2 style=\"margin:0 0 20px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.4vw,62px); line-height:1.06; letter-spacing:-.026em; max-width:22ch;\">The same bones. A different campaign.<\u002Fh2>\n      <p style=\"margin:0 0 60px; font-size:18px; line-height:1.68; color:#a39a8f; max-width:58ch;\">Three anchors, written once. Two tables playing them months apart. Nothing below was authored by you — and both runs are faithful to what you handed over.<\u002Fp>\n\n      <div style=\"border:1px solid rgba(176,122,78,.34); padding:30px 32px 34px; display:flex; flex-direction:column; gap:20px;\">\n        <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#c89060;\">The bones you wrote<\u002Fspan>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:28px;\">\n          <div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); gap:12px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#b07a4e;\">A<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:19px; line-height:1.42; color:#e8e1d6;\">A rival wants the tower at Shinebright.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); gap:12px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#b07a4e;\">B<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:19px; line-height:1.42; color:#e8e1d6;\">Ser'en carries a debt she cannot pay.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:18px minmax(0,1fr); gap:12px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:11px; color:#b07a4e;\">C<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:19px; line-height:1.42; color:#e8e1d6;\">The Ashgate compact breaks before winter.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex; align-items:center; gap:16px; padding:24px 0 28px; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:#8a8077;\">\n        <span style=\"flex:none;\">Handed to SEREN<\u002Fspan>\n        <span style=\"flex:1; height:1px; background:rgba(232,225,214,.12);\"><\u002Fspan>\n        <span style=\"flex:none;\">Played by two tables<\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:1px; background:rgba(232,225,214,.1); border:1px solid rgba(232,225,214,.1);\">\n        <div style=\"background:#141110; padding:38px 32px 42px; display:flex; flex-direction:column; gap:24px;\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#c89060;\">Table one<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8077;\">14 sessions<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:17px;\">\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">A<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The rival is bought off rather than killed. He becomes a landlord, and a problem.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">B<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The party clears Ser'en's debt for her. Now she owes them, and resents it.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">C<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The compact breaks in a council chamber, over a signature.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline; padding-top:17px; border-top:1px solid rgba(232,225,214,.09);\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#7f9b8c;\">→<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-style:italic; font-size:17px; line-height:1.52; color:#7f9b8c;\">Winter arrives and there is no war. There is a lawsuit.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#141110; padding:38px 32px 42px; display:flex; flex-direction:column; gap:24px;\">\n          <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:16px;\">\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#c89060;\">Table two<\u002Fspan>\n            <span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#8a8077;\">Same bones · 9 sessions<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:17px;\">\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">A<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The rival reaches the tower first. Four sessions are spent getting it back.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">B<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The debt is called in publicly. Ser'en leaves the party for six weeks to work it off.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline;\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#b07a4e;\">C<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-size:17px; line-height:1.52; color:#c4bcb1;\">The compact breaks over a body nobody meant to leave.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:20px minmax(0,1fr); gap:14px; align-items:baseline; padding-top:17px; border-top:1px solid rgba(232,225,214,.09);\"><span style=\"font-family:'Space Mono',monospace; font-size:10px; color:#7f9b8c;\">→<\u002Fspan><span style=\"font-family:'IBM Plex Serif',serif; font-style:italic; font-size:17px; line-height:1.52; color:#7f9b8c;\">Winter arrives mid-siege, and the tower is the only shelter for miles.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:40px 0 0; font-size:17px; line-height:1.7; color:#a39a8f; max-width:56ch;\">Every anchor you set was honoured. Neither campaign was written. This is what a DM does, and it is what a script cannot.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"allows\" style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09); background:#0c0a09;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:26px;\">What it allows<\u002Fdiv>\n      <h2 style=\"margin:0 0 68px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(34px,4.4vw,62px); line-height:1.06; letter-spacing:-.026em; max-width:22ch;\">Six things that were not possible before.<\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:1px; background:rgba(232,225,214,.1); border:1px solid rgba(232,225,214,.1);\">\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">01<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Continuity that holds<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">You never open a session by explaining your own world back to the machine. It already knows, and it knows what changed last time.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">02<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Characters who exist<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">Ser'en is a level 11 Circle of Stars druid. She is also someone with a debt, a grudge and a reason to distrust Kestrel. SEREN holds both, and neither contradicts the other.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">03<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Secrets kept correctly<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">Knowledge is tracked per person. An NPC cannot react to something they were never told, and the world cannot leak what the players haven't earned.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">04<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Consequences that compound<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">Factions move between sessions. Unclaimed power gets claimed. The world has business of its own and gets on with it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">05<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Preparation that persists<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">Work you did once stays done. The village you built in session two is still there, still populated, still remembering the party's manners.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:36px 30px 40px; display:flex; flex-direction:column; gap:14px;\">\n          <span style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; color:#8a8077;\">06<\u002Fspan>\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:25px; line-height:1.26; color:#e8e1d6;\">Your rules, honoured<\u002Fdiv>\n          <p style=\"margin:0; font-size:15px; line-height:1.68; color:#a39a8f;\">House rulings become part of the ruleset rather than something you re-argue every week. Your table's law is the law.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09);\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <h2 style=\"margin:0 0 60px; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(36px,5.2vw,80px); line-height:1.02; letter-spacing:-.03em;\">SEREN runs the world.<br><span style=\"font-style:italic; color:#c89060;\">You run the table.<\u002Fspan><\u002Fh2>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:56px;\">\n        <div style=\"display:flex; flex-direction:column; gap:22px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; padding-bottom:16px; border-bottom:1px solid rgba(176,122,78,.34);\">SEREN handles<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:13px; font-family:'IBM Plex Serif',serif; font-size:21px; color:#c4bcb1;\">\n            <div>Continuity<\u002Fdiv>\n            <div>State<\u002Fdiv>\n            <div>Adjudication support<\u002Fdiv>\n            <div>NPC behaviour<\u002Fdiv>\n            <div>World consequences<\u002Fdiv>\n            <div>Preparation<\u002Fdiv>\n            <div>Tracking<\u002Fdiv>\n            <div>Memory<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:22px;\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#7f9b8c; padding-bottom:16px; border-bottom:1px solid rgba(127,155,140,.4);\">You handle<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:13px; font-family:'IBM Plex Serif',serif; font-size:21px; color:#e8e1d6;\">\n            <div>Judgement<\u002Fdiv>\n            <div>Taste<\u002Fdiv>\n            <div>Improvisation<\u002Fdiv>\n            <div>Authority<\u002Fdiv>\n            <div>The table<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:14px 0 0; font-size:16px; line-height:1.7; color:#a39a8f; max-width:40ch;\">The final ruling is always yours. SEREN will tell you what is true and what it implies; it will not overrule you, and it will not pretend to be the person running the game.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"fit\" style=\"padding:112px 44px; border-bottom:1px solid rgba(232,225,214,.09); background:#0c0a09;\">\n    <div style=\"max-width:1240px; margin:0 auto;\">\n      <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#b07a4e; margin-bottom:56px;\">Fit<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:1px; background:rgba(232,225,214,.1); border:1px solid rgba(232,225,214,.1);\">\n        <div style=\"background:#100d0b; padding:44px 36px 48px; display:flex; flex-direction:column; gap:26px;\">\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:30px; color:#e8e1d6;\">Use this if<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:18px; font-size:17px; line-height:1.6; color:#c4bcb1;\">\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>You have a world you actually care about.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>Your campaigns run for years, not weekends.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>You are tired of correcting the AI about your own canon.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>You already have material — notes, documents, a bible — and want it used.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>Consequence matters more to you than novelty.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#7f9b8c;\">→<\u002Fspan><span>You want to stay the authority at your table.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#100d0b; padding:44px 36px 48px; display:flex; flex-direction:column; gap:26px;\">\n          <div style=\"font-family:'IBM Plex Serif',serif; font-size:30px; color:#93897f;\">Don't use this if<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:18px; font-size:17px; line-height:1.6; color:#8d857c;\">\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You want a one-shot adventure generated in a minute.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You want a rules lookup bot.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You are looking for generated art, maps or minis.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You want the model to have final authority over your world.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You have never wanted a campaign to outlast a session.<\u002Fspan><\u002Fdiv>\n            <div style=\"display:grid; grid-template-columns:22px minmax(0,1fr); gap:12px;\"><span style=\"color:#8a8077;\">×<\u002Fspan><span>You need every system supported today. This starts with 5e.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"waitlist\" style=\"position:relative; padding:148px 44px 132px; overflow:hidden;\">\n    <div style=\"position:absolute; inset:0; pointer-events:none; background-image:linear-gradient(rgba(232,225,214,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(232,225,214,.03) 1px, transparent 1px); background-size:112px 112px; mask-image:radial-gradient(90% 100% at 50% 100%, #000 0%, transparent 72%);\"><\u002Fdiv>\n    <div style=\"position:relative; max-width:1240px; margin:0 auto; display:flex; flex-direction:column; align-items:center; text-align:center; gap:44px;\">\n      <svg width=\"60\" height=\"60\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"display:block;\">\n        <circle cx=\"12\" cy=\"12\" r=\"10.5\" stroke=\"rgba(232,225,214,.16)\" stroke-width=\".6\"><\u002Fcircle>\n        <g style=\"transform-origin:12px 12px; animation:srSpinSlow 88s linear infinite;\">\n          <circle cx=\"12\" cy=\"12\" r=\"6.6\" stroke=\"#b07a4e\" stroke-width=\".7\" stroke-dasharray=\"2.4 3.4\"><\u002Fcircle>\n          <circle cx=\"18.6\" cy=\"12\" r=\"1.1\" fill=\"#7f9b8c\"><\u002Fcircle>\n        <\u002Fg>\n        <circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"#b07a4e\"><\u002Fcircle>\n      <\u002Fsvg>\n      <h2 style=\"margin:0; font-family:'IBM Plex Serif',serif; font-weight:300; font-size:clamp(40px,6.2vw,96px); line-height:1.0; letter-spacing:-.032em;\">You built the world.<br><span style=\"font-style:italic; color:#c89060;\">Now let it live.<\u002Fspan><\u002Fh2>\n      <p style=\"margin:0; max-width:46ch; font-size:18px; line-height:1.66; color:#a39a8f;\">SEREN AI is in private beta. Tell us what world you'd bring, and we'll open a seat when we can run it properly.<\u002Fp>\n      <div style=\"display:flex; flex-wrap:wrap; gap:10px; justify-content:center;\">\n        <input type=\"email\" placeholder=\"you@yourworld.com\" style=\"width:320px; padding:15px 18px; background:#171311; border:1px solid rgba(232,225,214,.2); border-radius:2px; color:#e8e1d6; font-family:'Space Mono',monospace; font-size:13px;\">\n        <button type=\"button\" style=\"padding:15px 30px; background:#b07a4e; border:none; border-radius:2px; color:#100d0b; font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; cursor:pointer;\" style-hover=\"background:#c89060\">Build with SEREN<\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:#8a8077;\">Waitlist open · No card, no demo call<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"padding:40px 44px; border-top:1px solid rgba(232,225,214,.09); display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:24px;\">\n    <div style=\"display:flex; align-items:center; gap:11px;\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"display:block;\">\n        <circle cx=\"12\" cy=\"12\" r=\"10.5\" stroke=\"rgba(232,225,214,.2)\" stroke-width=\"1\"><\u002Fcircle>\n        <circle cx=\"12\" cy=\"12\" r=\"6.6\" stroke=\"#b07a4e\" stroke-width=\"1\" stroke-dasharray=\"2.4 3.4\"><\u002Fcircle>\n        <circle cx=\"12\" cy=\"12\" r=\"2.5\" fill=\"#b07a4e\"><\u002Fcircle>\n      <\u002Fsvg>\n      <span style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#a39a8f;\">Seren&nbsp;AI<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:#8a8077;\">Persistent world intelligence · 2026<\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;heroHeadline&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;The world knows what happened&quot;,&quot;Run a world that remembers&quot;,&quot;Your world. Alive.&quot;],&quot;default&quot;:&quot;The world knows what happened&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const h = this.props.heroHeadline ?? \"The world knows what happened\";\n    return {\n      showUncanny: h === \"The world knows what happened\",\n      showRemembers: h === \"Run a world that remembers\",\n      showAlive: h === \"Your world. Alive.\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
